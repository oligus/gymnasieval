services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=gymnasieval'
      - 'MYSQL_USER=gymnasieval'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
    ports:
      - '3308:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'

volumes:
  mysql-data:
