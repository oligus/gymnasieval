spring.application.name=gymnasieval
server.port=8081

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Skolverkets öppna API:er (ingen nyckel behövs).
skolverket.planned-educations-url=https://api.skolverket.se/planned-educations/v3
skolverket.registry-url=https://api.skolverket.se/skolenhetsregistret/v2
skolverket.snapshot-file=data/skolverket.json
skolverket.concurrency=8

# Hämta lata relationer i klumpar om 100 i stället för en fråga per rad (undviker N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# GraphQL: API:et på /graphql, testverktyget GraphiQL på /graphiql, schemat i klartext på /graphql/schema.
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true
